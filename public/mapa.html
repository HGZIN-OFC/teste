<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shinobi Wilds · Mapa</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc3e8; font-family: "Trebuchet MS", Arial, sans-serif; user-select: none; }
  canvas#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #status { position: absolute; left: 12px; top: 10px; color: #fff; font-weight: 700; text-shadow: 1px 1px 0 #000; font-size: 13px; }
  #mini { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px; border-radius: 50%; overflow: hidden;
    border: 4px solid #fff; box-shadow: 0 0 0 3px #14142b, 0 6px 14px rgba(0,0,0,.4); background: #1d3a1f; pointer-events: auto; cursor: pointer; }
  #mini canvas { width: 100%; height: 100%; display: block; }
  #zoom { position: absolute; right: 16px; bottom: 214px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  #zoom button, #mapbtn { font: 800 16px Impact, Arial, sans-serif; color: #14142b; background: #ffd23f; border: 3px solid #fff; border-radius: 12px;
    box-shadow: 0 0 0 3px #14142b; width: 40px; height: 40px; cursor: pointer; }
  #mapbtn { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px; border-radius: 50%; background: transparent; border: 0; box-shadow: none; cursor: pointer; }
  #full { position: fixed; inset: 0; background: rgba(10,14,30,.88); display: none; align-items: center; justify-content: center; pointer-events: auto; }
  #full.on { display: flex; }
  #full canvas { width: min(92vw, 92vh); height: min(92vw, 92vh); border-radius: 16px; border: 4px solid #fff; box-shadow: 0 0 0 4px #14142b; background: #1d3a1f; }
  #ajuda { position: absolute; left: 12px; bottom: 12px; color: #fff; font-size: 12px; line-height: 1.5; text-shadow: 1px 1px 0 #000; }
</style>
</head>
<body>
<canvas id="cena"></canvas>
<div id="hud">
  <div id="status">Carregando mapa…</div>
  <div id="zoom">
    <button id="zin" title="Aproximar">+</button>
    <button id="zout" title="Afastar">−</button>
  </div>
  <div id="mini"><canvas id="mc" width="380" height="380"></canvas></div>
  <button id="mapbtn" title="Mapa completo (M)"></button>
  <div id="ajuda">WASD andar · Shift correr · Espaço pular · arraste o mouse para girar · roda para zoom · M mapa completo</div>
</div>
<div id="full"><canvas id="fc" width="900" height="900"></canvas></div>
<script>
  (function () {
    var local = false;
    try { var x = new XMLHttpRequest(); x.open('HEAD', '/vendor/three.module.js', false); x.send(); local = x.status === 200; } catch (e) {}
    var url = local ? '/vendor/three.module.js' : 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    document.write('<script type="importmap">' + JSON.stringify({ imports: { three: url } }) + '<\/script>');
  })();
</script>
<script type="module" src="/mapa.js"></script>
</body>
</html>
